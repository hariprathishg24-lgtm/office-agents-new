const clientPeriods=id=>db.periods.filter(p=>p.clientId===id).sort((a,b)=>b.start.localeCompare(a.start));
function usage(p){const rs=db.requests.filter(r=>r.periodId===p.id&&r.scope==='Included'&&r.status!=='Cancelled');return {committed:rs.reduce((s,r)=>s+r.hours,0),completed:rs.filter(r=>r.status==='Delivered').reduce((s,r)=>s+r.hours,0)}}
async function api(url,body){let r;try{r=await fetch(url,{signal:AbortSignal.timeout(30000),...(body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})})}catch(e){throw Error(e.name==='TimeoutError'?'The office took too long to respond. Check the record before retrying; the action may have completed.':'Cannot reach the office. Your entered information has been kept. Check that the server is running.')}let data;try{data=await r.json()}catch{throw Error('The office returned an unreadable response. Reload records before retrying.')}if(!r.ok)throw Error(data.error||'Unable to complete this action.');return data}
function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6500)}
async function updateAIStatus(){
 const el=$('backend');
 try{const s=await api('/api/business/ai-status');const labels={connected:'AI connected',disconnected:'AI not connected',unavailable:'AI connection unknown'};el.dataset.status=s.connection;el.title=s.detail;
 el.innerHTML='<span class="ai-connection">'+esc(labels[s.connection]||labels.unavailable)+'</span><span class="ai-activity">'+esc(s.active?('Active · '+s.active+' running'+(s.paused?' · Queue paused':'')):s.paused?'Paused':s.connection==='connected'?'Idle':'Inactive')+'</span><span class="ai-detail">'+esc(s.queued?s.queued+' queued · ':'')+'CLI · '+esc(s.connection==='connected'?'Signed in':'Check sign-in')+'</span><button class="small" data-action="check-ai">Check status</button>';
 }catch{el.dataset.status='unavailable';el.innerHTML='<span>AI status unavailable · Office may be offline</span><button class="small" data-action="check-ai">Retry</button>'}
}
async function refresh(){db=await api('/api/business');try{[health,tasks]=await Promise.all([api('/api/health'),api('/api/tasks')]);}catch{}render();await updateAIStatus()}
async function mutate(action,data,revision=modalRevision){const r=await api('/api/business',{action,data,revision});db=r.state;render();return r.entity}
function openModal(title,html,onSave,label='Save'){modalDirty=false;$('discard-prompt')?.remove();modalSave=onSave;modalRevision=db.revision;$('modal-title').textContent=title;$('modal-body').innerHTML=html;$('form-error').textContent='';$('save').textContent=label;$('save').hidden=!onSave;$('modal').showModal()}
const field=(label,name,value='',type='text',required=false)=>`<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`;
const area=(label,name,value='',required=false)=>`<label class="full">${esc(label)}<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea></label>`;
const select=(label,name,options,value)=>`<label>${esc(label)}<select name="${name}">${options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;

function render(){if(!db)return;document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('selected',b.dataset.nav===view);if(b.dataset.nav===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const query=$('search').value.trim().toLowerCase();if(query){renderSearch(query);return}const out=$('content');if(view==='home')out.innerHTML=home();else if(view==='clients')out.innerHTML=clientId&&selectedClient()?clientPage():clients();else if(view==='work')out.innerHTML=heading('Delivery management','Work register','Track scope, deadlines and approval status across every account.')+`<div class="page-toolbar"><span class="view-count">${db.requests.length} requests across your workspace</span><select id="work-filter" aria-label="Filter work by status">${['All','Ready','In progress','Waiting','Review','Delivered','Cancelled'].map(s=>`<option ${workFilter===s?'selected':''}>${s}</option>`).join('')}</select></div>`+workList(db.requests.filter(r=>workFilter==='All'||r.status===workFilter));else if(view==='money')out.innerHTML=money();else out.innerHTML=business()}
function home(){const active=db.clients.filter(c=>c.stage==='Active').length;const review=db.requests.filter(r=>r.status==='Review'&&!r.approval);const waiting=db.requests.filter(r=>r.status==='Waiting');const late=db.requests.filter(r=>r.due&&r.due<today()&&!['Delivered','Cancelled'].includes(r.status));const overdue=db.invoices.filter(i=>i.status==='Issued'&&i.due<today());return heading('Operations overview','Company overview','Review delivery commitments, account decisions and billing exceptions.')+(!db.settings.setupComplete?`<div class="notice row between"><span><strong>Start with your business preferences.</strong> Then add one client and their agreement.</span>${button('Set up business','settings','','primary')}</div>`:'')+`<div class="metrics">${metric(active,'Active retainers')}${metric(review.length,'Awaiting approval')}${metric(late.length,'Overdue work')}${metric(overdue.length,'Overdue invoices')}</div>`+(!db.clients.length?welcome():`<div class="grid"><section class="card"><h2>Needs your decision</h2>${review.length?review.slice(0,4).map(r=>`<div class="line"><strong>${esc(r.title)}</strong><p class="quiet">${esc(clientName(r.clientId))} · Version ${r.version}</p>${button('Review deliverable','request',r.id,'small')}</div>`).join(''):'<p>No deliverables awaiting approval.</p>'}${late.length?`<p class="quiet">${late.length} request(s) have passed their recorded deadline.</p>`:''}</section><section class="card"><h2>Waiting for someone</h2>${waiting.length?waiting.slice(0,4).map(r=>`<div class="line"><strong>${esc(r.title)}</strong><p class="quiet">${esc(clientName(r.clientId))} · ${esc(r.scope)}</p>${button('Resolve next step','request',r.id,'small')}</div>`).join(''):'<p>No requests currently marked waiting.</p>'}</section><section class="card full"><div class="row between"><div><h2>Ask your AI team</h2><p class="quiet">Claude Code CLI uses the client records you have already saved. Results return here.</p></div>${button('Prepare client work','ai','','primary')}</div></section></div>`)}
function clients(){
 const visible=db.clients.filter(c=>clientFilter==='All'||c.stage===clientFilter).sort((a,b)=>a.name.localeCompare(b.name));
 return heading('Client management','Client portfolio','Agreements, delivery commitments and account ownership in one register.')+
 '<div class="page-toolbar"><span class="view-count">'+visible.length+' of '+db.clients.length+' clients</span><div class="row"><select id="client-filter" aria-label="Filter clients by stage">'+['All',...stages].map(s=>'<option '+(clientFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+button('Add client','client','','primary')+'</div></div>'+
 (visible.length?'<div class="register"><table><caption class="sr-only">Client portfolio</caption><thead><tr><th>Client</th><th>Services</th><th>Stage</th><th>Period fee</th><th>Open work</th><th>Renewal</th></tr></thead><tbody>'+visible.map(c=>'<tr><td data-label="Client"><div class="account-cell"><span class="avatar" aria-hidden="true">'+esc(c.name.slice(0,2).toUpperCase())+'</span><div>'+button(c.name,'open-client',c.id,'record-link')+'<div class="cell-meta">'+esc(c.contact||'Contact not recorded')+'</div></div></div></td><td data-label="Services">'+esc(c.services.join(' · '))+'</td><td data-label="Stage">'+badge(c.stage,c.stage==='Active'?'good':'')+'</td><td data-label="Period fee" class="money">'+fmt(c.fee,c.currency)+'</td><td data-label="Open work">'+db.requests.filter(r=>r.clientId===c.id&&!['Delivered','Cancelled'].includes(r.status)).length+'</td><td data-label="Renewal">'+esc(c.renewalDate||'Not recorded')+'</td></tr>').join('')+'</tbody></table><div class="register-foot">Fees follow each client’s contract period. Different currencies are not combined.</div></div>':empty(db.clients.length?'No clients in this stage':'Your client register is ready',db.clients.length?'Choose another stage or clear the filter.':'Add the first client and their actual agreement to begin.','client','Add client'));
}
function clientPage(){const c=selectedClient(),ps=clientPeriods(c.id),rs=db.requests.filter(r=>r.clientId===c.id);let body='';if(tab==='Overview')body=`<div class="grid"><section class="card"><h2>What success means</h2><p class="wrap">${esc(c.goals||'Add the client’s goals so plans and reports have a clear purpose.')}</p><h3>Contact</h3><p>${esc(c.contact||'Not recorded')}</p>${button('Edit client and agreement','client',c.id)}</section><section class="card"><h2>The next step</h2><p>${!ps.length?'Open the first contract period using the dates in the agreement.':rs.length?'Review the current work, approvals and billing before closing the period.':'Add the agreed requests or ask AI to prepare a plan from the agreement.'}</p><div class="actions">${button('Open period','period',c.id)}${button('Ask AI','ai',c.id,'primary')}</div><p class="quiet">Renewal: ${esc(c.renewalDate||'Not recorded')} · Notice: ${c.noticeDays===null?'Not recorded':esc(c.noticeDays)+' days'}</p></section><section class="card full"><h2>Recent account activity</h2>${history(c.id)}</section></div>`;
 if(tab==='Plan & requests')body=`<div class="row" style="margin-bottom:16px">${button('Open period','period',c.id)}${button('Add request','new-request',c.id,'primary')}</div><div class="stack">${ps.map(p=>{const u=usage(p);return `<section class="card"><div class="row between"><h2>${esc(periodName(p))}</h2>${badge(p.closed?'Closed':'Open',p.closed?'':'good')}</div><p>${esc(p.priorities||'No priorities recorded.')}</p><div class="row">${badge(p.allowance===null?'Allowance not specified':`${u.committed} / ${p.allowance} hours committed`)}${badge(`${u.completed} estimated hours delivered`)}${badge(fmt(p.fee,p.currency))}</div><div class="actions">${!p.closed?button('Add request','period-request',p.id)+button('Close period','close-period',p.id):''}${button('Prepare invoice record','invoice',p.id)}</div></section>`}).join('')||empty('Open the first period','Use the contract’s actual start and end dates.','period','Open period')}</div>`;
 if(tab==='Delivery')body=`<div class="actions" style="margin-bottom:15px">${button('Add request','new-request',c.id,'primary')}</div>`+workList(rs);
 if(tab==='AI & reports')body=`<div class="card"><h2>Your CLI-powered team</h2><p>Prepare plans, reports, scope reviews and renewal packs using this client’s saved agreement, periods, requests and invoices. Reports do not automatically change records or contact clients.</p>${button('Prepare with AI','ai',c.id,'primary')}</div>`+aiResults(c.id);
 if(tab==='Agreement & billing')body=`<div class="grid"><section class="card"><h2>Agreement</h2><p class="money">${fmt(c.fee,c.currency)} per contract period</p><p>${c.allowance===null?'Included hours not specified':`${esc(c.allowance)} included hours`}</p><div class="result">${esc(c.agreement||'Paste the agreed terms before asking AI to assess scope.')}</div><div class="actions">${button('Edit agreement','client',c.id)}</div><p class="quiet">Existing periods keep their original fee and terms snapshot.</p></section><section class="card"><h2>Invoice records</h2>${invoiceList(db.invoices.filter(i=>i.clientId===c.id))}</section></div>`;
 return `${button('← All clients','back-clients','','small')}`+heading(c.services.join(' · '),c.name)+`<div class="flow">${stages.map(s=>`<span class="${s===c.stage?'current':''}">${s}</span>`).join('')}</div><div class="tabs">${['Overview','Plan & requests','Delivery','AI & reports','Agreement & billing'].map(t=>`<button data-tab="${esc(t)}" class="${tab===t?'selected':''}">${esc(t)}</button>`).join('')}</div>${body}`}
function history(id){const ids=new Set([id,...db.periods.filter(p=>p.clientId===id).map(p=>p.id),...db.requests.filter(r=>r.clientId===id).map(r=>r.id),...db.invoices.filter(i=>i.clientId===id).map(i=>i.id)]);return `<div class="history">${db.events.filter(e=>ids.has(e.entity)).slice(-8).reverse().map(e=>`<div>${esc(new Date(e.at).toLocaleString())} · ${esc(e.detail)}</div>`).join('')||'No activity yet.'}</div>`}
function workList(rs){
 if(!rs.length)return empty(db.requests.length?'No requests match this view':'No requests recorded',db.requests.length?'Change the status filter or add a request.':'Open a client period, then record the agreed work.','new-request','Add request');
 const sorted=rs.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 return '<div class="register"><table><caption class="sr-only">Delivery requests</caption><thead><tr><th>Request / client</th><th>Service</th><th>Status</th><th>Scope</th><th>Estimate</th><th>Deadline</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>'+sorted.map(r=>'<tr><td data-label="Request"><strong>'+esc(r.title)+'</strong><div class="cell-meta">'+esc(clientName(r.clientId))+'</div></td><td data-label="Service">'+esc(r.service)+'</td><td data-label="Status">'+badge(r.status,r.status==='Review'?'warn':r.status==='Delivered'?'good':'')+'</td><td data-label="Scope">'+badge(r.scope,r.scope==='Unclear'?'warn':'')+'</td><td data-label="Estimate">'+r.hours+' h</td><td data-label="Deadline"><span class="'+(r.due&&r.due<today()&&!['Delivered','Cancelled'].includes(r.status)?'overdue':'')+'">'+esc(r.due||'Not set')+'</span></td><td data-label="Action">'+button('Open request','request',r.id,'small')+'</td></tr>').join('')+'</tbody></table><div class="register-foot">'+rs.length+' requests · Sorted by deadline · Hours are estimates, not recorded time.</div></div>';
}
function invoiceList(invoices){return invoices.length?'<div class="register invoice-register"><table><caption class="sr-only">Invoice records</caption><thead><tr><th>Invoice / client</th><th>Amount</th><th>Status</th><th>Due</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>'+invoices.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(i=>'<tr><td data-label="Invoice"><strong>'+esc(i.reference)+'</strong><div class="cell-meta">'+esc(clientName(i.clientId))+'</div></td><td data-label="Amount" class="money">'+fmt(i.amount,i.currency)+'</td><td data-label="Status">'+badge(i.status,i.status==='Paid'?'good':i.status==='Disputed'?'warn':'')+'</td><td data-label="Due">'+esc(i.due)+'</td><td data-label="Action">'+(!['Paid','Void'].includes(i.status)?button('Update record','invoice-status',i.id,'small'):'<span class="cell-meta">Reconciled record</span>')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="inline-empty"><strong>No invoice records</strong><p>Open a contract period to prepare the first billing record.</p></div>'}

function money(){const sums={};for(const i of db.invoices.filter(i=>i.status==='Issued'||i.status==='Disputed'))sums[i.currency]=(sums[i.currency]||0)+i.amount;return heading('Financial administration','Billing register','Internal invoice records, outstanding balances and payment evidence.')+`<div class="metrics">${metric(db.invoices.filter(i=>i.status==='Draft').length,'Draft records')}${metric(db.invoices.filter(i=>i.status==='Paid').length,'Recorded paid')}${metric(db.invoices.filter(i=>i.status==='Disputed').length,'Disputed')}${metric(db.invoices.filter(i=>i.status==='Issued'&&i.due<today()).length,'Overdue')}</div><div class="card"><h2>Outstanding by currency</h2><p>${Object.entries(sums).map(([c,n])=>fmt(n,c)).join(' · ')||'No issued or disputed balances recorded.'}</p><h2>Invoice records</h2>${invoiceList(db.invoices)}</div><div class="notice">Invoice creation prepares an internal record. Mark “Issued” only after it was actually issued; record payment only with evidence. Taxes and payment-provider integration are not configured here.</div>`}
function business(){return heading('Your operating foundation','Business settings','Keep the everyday experience simple. Advanced tools stay here.')+`<div class="grid"><section class="card"><h2>${esc(db.settings.name)}</h2><p>Design · Development · Marketing · Automation</p><p>Working hours: ${esc(db.settings.workingHours||'Not set')}<br>Weekly capacity: ${db.settings.capacityHours===null?'Not set':esc(db.settings.capacityHours)+' hours'}</p>${button('Edit preferences','settings')}</section><section class="card"><h2>AI through your CLI</h2><p>${health?.backend==='claude-cli'?'Claude Code CLI is the configured backend. It uses the office’s existing login and tool permissions.':'Claude Code CLI is required for client AI tasks. API-key execution is not accepted by this workspace.'}</p><p class="quiet">A configured backend does not prove that the login or every connector is working. Failed runs show their error in the client’s AI results.</p>${button('View connections','connections')}</section><section class="card"><h2>Automations</h2><p>Your 40 prepared workflows and schedule controls are available inside this workspace.</p>${button('Open automation catalogue','advanced')}</section><section class="card"><h2>Office controls & approvals</h2><p>Inspect existing agent approvals, failures and the office pause control.</p>${button('Open office controls','operations')}</section><section class="card full"><h2>Records and access</h2><p>These business records are saved locally with a previous-copy backup. This workspace is for the owner on this computer; a client-facing portal, external synchronization and unattended hosting are not configured.</p>${button('Export business records','export')}</section></div>`}
function aiResults(id){const list=tasks.filter(t=>t.goal==='business:'+id);return `<div class="stack" style="margin-top:18px">${list.slice().reverse().map(t=>`<section class="card"><div class="row between"><h3>${esc(t.title)}</h3>${badge(t.error?'Failed':t.state,t.error?'warn':'')}</div><p class="quiet">Claude Code CLI · ${esc(t.agent)} · ${t.addedAt?esc(new Date(t.addedAt).toLocaleString()):''}</p><div class="result">${esc(t.result||t.lastError||'Your task is queued or running. Results appear here automatically.')}</div></section>`).join('')||empty('No AI work for this client yet','Ask the CLI-powered team to prepare a plan or report from the saved records.','','')}</div>`}
function renderSearch(q){const cs=db.clients.filter(c=>`${c.name} ${c.contact}`.toLowerCase().includes(q)),rs=db.requests.filter(r=>`${r.title} ${r.description}`.toLowerCase().includes(q)),is=db.invoices.filter(i=>i.reference.toLowerCase().includes(q));$('content').innerHTML=heading('Search','Find the right record')+`<div class="stack">${cs.map(c=>`<div class="card">${button(c.name,'open-client',c.id,'client-button')}</div>`).join('')}${rs.length?workList(rs):''}${is.length?`<div class="card">${invoiceList(is)}</div>`:''}${!cs.length&&!rs.length&&!is.length?'<p>No matching records.</p>':''}</div>`}

function settings(){openModal('Set up your business',`<div class="fields">${field('Business name','name',db.settings.name,'text',true)}${field('Weekly capacity in hours (optional)','capacityHours',db.settings.capacityHours??'','number')}${area('Working hours and protected time','workingHours',db.settings.workingHours)}</div>`,async f=>{await mutate('settings',Object.fromEntries(f));toast('Business preferences saved. Add a client to continue.')})}
function clientForm(id){const c=db.clients.find(c=>c.id===id)||{services:serviceNames,stage:'Lead',currency:'INR'};openModal(id?'Edit client and agreement':'Add your client',`<p>Save the terms you actually agreed. Unknown allowances and notice periods can stay blank.</p><div class="fields">${field('Client name','name',c.name,'text',true)}${field('Contact name / email','contact',c.contact)}${select('Relationship stage','stage',stages,c.stage)}${field('Retainer fee per contract period','fee',c.fee??'','number',true)}${field('Currency code','currency',c.currency,'text',true)}${field('Included hours (optional)','allowance',c.allowance??'','number')}<div class="full"><label>Services</label><div class="checks">${serviceNames.map(s=>`<label><input type="checkbox" name="services" value="${s}" ${c.services.includes(s)?'checked':''}>${s}</label>`).join('')}</div></div>${area('Agreed scope, exclusions, revisions and billing rules','agreement',c.agreement)}${area('Client goals','goals',c.goals)}${field('Renewal date (optional)','renewalDate',c.renewalDate,'date')}${field('Notice period in days (optional)','noticeDays',c.noticeDays??'','number')}</div>`,async f=>{const data={...Object.fromEntries(f),services:f.getAll('services'),...(id?{id}:{})};clientId=await mutate('client',data);view='clients';tab='Overview';render();toast('Client saved. Open a contract period to start planning.')})}
function periodForm(id){const c=db.clients.find(c=>c.id===id)||selectedClient();if(!c){toast('Choose or add a client first.');view='clients';render();return}openModal('Open a contract period',`<p>${esc(c.name)} · Use the actual contract dates. The fee and agreement are saved with this period.</p><div class="fields">${field('Start date','start','','date',true)}${field('End date','end','','date',true)}${field('Fee for this period','fee',c.fee,'number',true)}${field('Included hours (optional)','allowance',c.allowance??'','number')}${area('Priorities for this period','priorities')}</div>`,async f=>{await mutate('period',{...Object.fromEntries(f),clientId:c.id});tab='Plan & requests';render();toast('Period opened. Add requests or ask AI for a plan.')})}
function requestForm(cid,pid,rid){const existing=db.requests.find(r=>r.id===rid)||{};const periods=db.periods.filter(p=>!p.closed&&(!cid||p.clientId===cid));if(!periods.length){toast('Open a client contract period first.');view='clients';render();return}const p=periods.find(p=>p.id===pid)||periods[0];openModal(rid?'Edit request':'Add a request',`<div class="fields">${select('Client and period','periodId',periods.map(p=>[p.id,clientName(p.clientId)+' · '+periodName(p)]),p.id)}${field('Request title','title',existing.title||'','text',true)}${select('Service','service',serviceNames,existing.service||serviceNames[0])}${select('Scope','scope',['Included','Additional','Unclear'],existing.scope||'Unclear')}${field('Estimated hours','hours',existing.hours??'','number',true)}${field('Deadline (optional)','due',existing.due||'','date')}${area('Brief and acceptance criteria','description',existing.description||'')}</div><p class="quiet">Included requests are checked against the period allowance. Additional or unclear work waits for a recorded scope decision.</p>`,async f=>{await mutate('request',{...Object.fromEntries(f),...(rid?{id:rid}:{})});toast('Request saved.');})}
function requestDetail(id){const r=db.requests.find(r=>r.id===id);if(!r)return;const locked=['Delivered','Cancelled'].includes(r.status);openModal(r.title,`<div class="row">${badge(r.status)}${badge(r.scope)}${badge(r.service)}</div><p>${esc(clientName(r.clientId))} · ${r.hours} estimated hours · Due ${esc(r.due||'not set')}</p><div class="result">${esc(r.description||'No brief recorded.')}</div>${r.deliverable?`<div class="notice wrap"><strong>Deliverable version ${r.version}</strong><br>${esc(r.deliverable)}</div>`:''}${r.approval?`<p class="quiet">Approval recorded by ${esc(r.approval.by)} for v${r.approval.version}: ${esc(r.approval.evidence)}</p>`:''}${r.scopeEvidence?`<p class="quiet">Scope decision: ${esc(r.scopeEvidence)}</p>`:''}<div class="actions">${!locked?`${r.scope!=='Included'&&!r.scopeEvidence?button('Resolve scope','scope',r.id):''}${button('Edit request','edit-request',r.id)}${button('Update status','work-status',r.id)}${button('Submit deliverable','deliverable',r.id)}${r.status==='Review'&&!r.approval?button('Record approval','approval',r.id,'primary'):''}`:''}</div>`,null)}

document.addEventListener('click',async event=>{const target=event.target.closest('button');if(!target||busy)return;if(target.dataset.nav){view=target.dataset.nav;clientId=null;$('search').value='';render();return}if(target.dataset.tab){tab=target.dataset.tab;render();return}const action=target.dataset.action,id=target.dataset.id;if(!action)return;
 try{
 if(action==='close'){closeEditor();return}
 if(action==='keep-editing'){$('discard-prompt')?.remove();$('modal-body').querySelector('input,textarea,select')?.focus();return}
 if(action==='discard-draft'){modalDirty=false;$('discard-prompt')?.remove();$('modal').close();return}
 if(action==='reload-records'){if($('modal').open){toast('Close this editor before reloading records.');return}await refresh();recovery.hidden=true;toast('Records reloaded.');return}
 if(action==='check-ai'){target.disabled=true;await updateAIStatus();return}
 if(action==='settings')settings();
 else if(action==='add')openModal('Add to your workspace',`<div class="stack">${button('Client or prospect','add-client')}${button('Work request','add-request')}${button('Ask AI to prepare work','add-ai')}</div>`,null);
 else if(action==='add-client'){$('modal').close();clientForm()}
 else if(action==='add-request'){$('modal').close();requestForm(clientId)}
 else if(action==='add-ai'){$('modal').close();aiForm(clientId)}
 else if(action==='client')clientForm(id);
 else if(action==='open-client'){clientId=id;view='clients';tab='Overview';$('search').value='';render()}
 else if(action==='back-clients'){clientId=null;render()}
 else if(action==='period')periodForm(id);
 else if(action==='new-request')requestForm(id||clientId);
 else if(action==='period-request')requestForm(null,id);
 else if(action==='request')requestDetail(id);
 else if(action==='edit-request'){const r=db.requests.find(r=>r.id===id);$('modal').close();requestForm(r.clientId,r.periodId,r.id);}
 else if(action==='ai')aiForm(id);
 else if(action==='scope')nextModal('Resolve the scope decision',area('What was agreed? Include the approval or quote reference.','evidence','',true),async f=>{await mutate('scope',{id,...Object.fromEntries(f)});toast('Scope decision recorded. The request is ready.');});
 else if(action==='work-status')nextModal('Update work status',select('Status','status',['Ready','In progress','Waiting','Review','Delivered','Cancelled'],db.requests.find(r=>r.id===id).status),async f=>{await mutate('work',{id,...Object.fromEntries(f)});toast('Work status saved.')});
 else if(action==='deliverable')nextModal('Submit a deliverable',area('Link or file reference for the exact version','reference','',true)+'<p class="quiet">Submitting a new version clears earlier approval.</p>',async f=>{await mutate('deliverable',{id,...Object.fromEntries(f)});toast('Deliverable ready for review.')});
 else if(action==='approval'){const r=db.requests.find(r=>r.id===id);nextModal('Record approval of version '+r.version,`<p class="wrap">${esc(r.deliverable)}</p>`+field('Who approved this version?','by','','text',true)+area('Approval evidence: message, date, or record reference','evidence','',true),async f=>{await mutate('approval',{id,version:r.version,...Object.fromEntries(f)});toast('Approval recorded. Mark delivered after the handover is complete.')});}
 else if(action==='invoice'){const p=db.periods.find(p=>p.id===id);openModal('Prepare an invoice record',`<p>${esc(clientName(p.clientId))} · ${esc(periodName(p))} · ${fmt(p.fee,p.currency)}</p><p class="quiet">This records the agreed period fee. It does not issue an invoice or calculate taxes.</p><div class="fields">${field('Invoice reference','reference','','text',true)}${field('Due date','due','','date',true)}</div>`,async f=>{await mutate('invoice',{periodId:id,...Object.fromEntries(f)});toast('Draft invoice record created.')});}
 else if(action==='invoice-status'){const i=db.invoices.find(i=>i.id===id);const choices=i.status==='Draft'?['Issued','Void']:i.status==='Disputed'?['Issued','Paid','Void']:['Paid','Disputed','Void'];openModal('Update invoice record',select('Actual status','status',choices,choices[0])+area('Evidence: invoice link, payment reference, or dispute details','evidence','',true),async f=>{await mutate('invoice-status',{id,...Object.fromEntries(f)});toast('Invoice status recorded.')});}
 else if(action==='close-period')openModal('Close the contract period','<p>All requests must be delivered or cancelled, and the period invoice must be recorded paid. The next period is created separately from its actual agreement dates.</p>'+area('Period summary and next-period considerations','summary','',true),async f=>{await mutate('close-period',{id,...Object.fromEntries(f)});toast('Period closed. Its history remains available.')});
 else if(action==='advanced'||action==='operations'){$('content').innerHTML=heading('Business',action==='advanced'?'Automation catalogue':'Office controls')+`<iframe title="${action==='advanced'?'Automation catalogue':'Office controls'}" src="${action==='advanced'?'/solo/advanced':'/ops'}"></iframe>`;}
 else if(action==='connections'){const m=await api('/api/mcp');openModal('Existing office connections',`<p class="quiet">Connections come from your Claude Code CLI setup. This page does not grant or change permissions.</p><div class="stack">${(m.servers||[]).map(s=>`<div class="card"><strong>${esc(s.name||s.key)}</strong><p>${esc(s.status||'Unknown')}</p></div>`).join('')||'<p>No connections reported. Business records can still be entered manually.</p>'}</div>`,null)}
 else if(action==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='origin-pixel-business.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 }catch(e){toast(e.message)}
});
$('form').addEventListener('submit',async event=>{event.preventDefault();if(!modalSave||busy)return;busy=true;const saveLabel=$('save').textContent;$('save').disabled=true;$('save').textContent='Working…';$('form').setAttribute('aria-busy','true');$('form-error').textContent='';try{await modalSave(new FormData($('form')));modalDirty=false;$('modal').close()}catch(e){$('form-error').textContent=e.message;if(e.message.includes('another window')){showRecovery('Another window changed these records. Close this editor, reload records, then review your changes before saving.')} $('form-error').setAttribute('tabindex','-1');$('form-error').focus()}finally{busy=false;$('save').disabled=false;$('save').textContent=saveLabel;$('form').removeAttribute('aria-busy')}});
$('search').addEventListener('input',render);
try{const catalogue=await api('/api/solo');workflowList=catalogue.workflows;await refresh()}catch(e){$('backend').textContent='Office unavailable';$('content').innerHTML='<div class="empty"><h2>Workspace unavailable</h2><p>Your records have not been replaced. Start the office server, then reload records.</p></div>';showRecovery(e.message)}
setInterval(async()=>{if(busy||$('modal').open)return;try{const [currentTasks,currentDb]=await Promise.all([api('/api/tasks'),api('/api/business')]);tasks=currentTasks;await updateAIStatus();if(currentDb.revision!==db.revision)showRecovery('Newer records are available. Reload to see changes made in another window.');if(view==='clients'&&tab==='AI & reports'&&!$('search').value)render()}catch{$('backend').dataset.status='unavailable';$('backend').textContent='Office connection unavailable';showRecovery('Connection lost. Displayed information may be outdated.')}},15000);
</script></body></html>
